name: Retire releases

# 옛 버전의 릴리스(설치 파일 · blockmap · latest.yml)와 태그를 지운다.
#
# 왜 여기서 — 작업 세션의 프록시는 릴리스 삭제 API 를 막는다. 이 저장소의 기본 GITHUB_TOKEN 으로
# Actions 안에서 지운다(시크릿 필요 없음).
#
# 막아 둔 것
#   · 최신 릴리스는 지우지 않는다 — 앱의 자동 업데이트가 그 릴리스의 latest.yml 을 읽는다.
#   · confirm 에 delete 를 적어야 돈다 · 태그는 v<숫자>.<숫자>.<숫자> 만.
#
# 지운 뒤 홈페이지를 다시 빌드하게 부른다(notify-homepage.yml 과 같은 시크릿). GITHUB_TOKEN 으로 지운
# 릴리스의 deleted 이벤트는 다른 워크플로를 깨우지 않아서 notify-homepage 가 돌지 않기 때문이다.
# 홈페이지는 latest.yml 이 없는 옛 버전을 변경 내역에 남기고 내려받기 버튼만 뺀다(dode777.github.io#8).
#
# 2026-10-17 — 2.x 가 나와 1.x(v1.0.0 ~ v1.2.2)를 지웠다.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: '지울 태그 (빈칸으로 여러 개, 예: v1.0.0 v1.1.0)'
        type: string
        required: true
      confirm:
        description: '안전장치 — delete 를 입력'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: retire-releases
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 릴리스 · 태그 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "delete" ]; then
            echo "::error::confirm 에 delete 를 입력해야 합니다."; exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # 하나라도 잘못되면 아무것도 지우지 않는다 — 먼저 전부 검사한다
          for t in $TAGS; do
            if ! [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::태그 형식이 아닙니다: $t"; exit 1
            fi
            if [ "$t" = "$LATEST" ]; then
              echo "::error::최신 릴리스($LATEST)는 지우지 않습니다 — 자동 업데이트가 읽습니다."; exit 1
            fi
          done
          echo "### 지운 릴리스 (최신: $LATEST)" >> "$GITHUB_STEP_SUMMARY"
          for t in $TAGS; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "- $t — 릴리스 · 태그" | tee -a "$GITHUB_STEP_SUMMARY"
            elif gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t"
              echo "- $t — 태그만 남아 있어 태그를 지움" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- $t — 없음" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 홈페이지 Rebuild site 요청
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEPAGE_DISPATCH_TOKEN 이 없습니다 — 홈페이지 저장소의 Actions › Rebuild site 를 직접 실행하세요."; exit 1
          fi
          gh api repos/dode777/dode777.github.io/dispatches -f event_type=update-notes
          echo "홈페이지 Rebuild site 를 요청했습니다."
